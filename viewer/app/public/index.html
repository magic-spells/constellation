<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Constellation</title>
  <!--
    Pre-paint: puzzle-pieces 0.8 `registry/theme/pre-paint.js`, inlined so the
    stored scheme + mode land before first paint (no flash). Local edits:
    `observatory` is in SCHEMES and is the default scheme, and the two keys the
    old ThemeControls wrote (`constellation-scheme`, `constellation-theme`) are
    migrated once into the one JSON key appearance.js reads. The defaults paint
    before storage is read, and a junk stored value is validated and rewritten.
    Keep SCHEMES in step with app/lib/appearance.js.
  -->
  <script data-key="constellation:appearance" data-default-scheme="observatory">
    (function () {
      var SCHEMES = ['observatory', 'default', 'dim', 'warm', 'void'];
      var MODES = ['light', 'medium', 'dark'];
      var script = document.currentScript;
      var attr = function (name) {
        return script ? script.getAttribute(name) : null;
      };
      var key = attr('data-key') || 'puzzle:appearance';
      window.__puzzleAppearance = { key: key, scheme: attr('data-default-scheme'), mode: attr('data-default-mode') };
      var root = document.documentElement;
      var fallbackScheme = SCHEMES.indexOf(attr('data-default-scheme')) !== -1 ? attr('data-default-scheme') : 'default';
      var fallbackMode = MODES.indexOf(attr('data-default-mode')) !== -1 ? attr('data-default-mode') : null;
      // Paint the defaults FIRST, so storage that throws or holds junk still
      // gets Observatory rather than the bare pieces palette until boot().
      var paint = function (scheme, mode) {
        if (scheme !== 'default') root.setAttribute('data-scheme', scheme);
        else root.removeAttribute('data-scheme');
        if (mode) {
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode === 'light' ? 'light' : 'dark';
        } else {
          root.removeAttribute('data-theme');
          root.style.colorScheme = '';
        }
      };
      paint(fallbackScheme, fallbackMode);
      try {
        var raw = localStorage.getItem(key);
        // Migration from the pre-1.1 ThemeControls: two plain-string keys. An
        // absent theme meant "follow the OS", which is mode: null here.
        if (raw === null) {
          var oldScheme = localStorage.getItem('constellation-scheme');
          var oldTheme = localStorage.getItem('constellation-theme');
          if (oldScheme !== null || oldTheme !== null) {
            raw = JSON.stringify({
              scheme: SCHEMES.indexOf(oldScheme) !== -1 ? oldScheme : fallbackScheme,
              mode: oldTheme === 'light' || oldTheme === 'dark' ? oldTheme : null,
            });
            localStorage.setItem(key, raw);
            localStorage.removeItem('constellation-scheme');
            localStorage.removeItem('constellation-theme');
          }
        }
        if (raw === null) return;
        // Validate the way appearance.js read() does: a known scheme (a stored
        // `theme` field counts), a known mode (`mixed` reads as medium), and an
        // explicit `mode: null` meaning "follow the OS". Anything else is junk,
        // and junk is rewritten so it cannot repaint the wrong scheme next load.
        var pick = null;
        try {
          pick = JSON.parse(raw);
        } catch (e) {
          pick = null;
        }
        var valid = !!pick && typeof pick === 'object' && !Array.isArray(pick);
        if (!valid) pick = {};
        var scheme = SCHEMES.indexOf(pick.scheme) !== -1 ? pick.scheme : SCHEMES.indexOf(pick.theme) !== -1 ? pick.theme : null;
        if (!scheme) {
          valid = false;
          scheme = fallbackScheme;
        }
        var mode = pick.mode === 'mixed' ? 'medium' : pick.mode;
        if (pick.mode === null) mode = null;
        else if (MODES.indexOf(mode) === -1) {
          if (mode !== undefined) valid = false;
          mode = fallbackMode;
        }
        if (!valid) localStorage.setItem(key, JSON.stringify({ scheme: scheme, mode: mode }));
        paint(scheme, mode);
      } catch (e) {
        /* storage unavailable — the defaults above stand */
      }
    })();
  </script>
  <!-- Relative asset paths so the bundle works when served from a sub-path. -->
  <link href="./styles.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
